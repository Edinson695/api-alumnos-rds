org: edinsonvasquez
service: api-alumnos-rds-v2

provider:
  name: aws
  runtime: python3.13
  memorySize: 1024
  timeout: 20
  iam:
    role: arn:aws:iam::213807131396:role/LabRole
  environment:
    DB_HOST: /rds_mysql_alumnos/punto_enlace
    DB_USER: user_${sls:stage}
    DB_PASSWORD: alumnos/${sls:stage}/password
    DB_NAME: ${sls:stage}

functions:
  listar:
    handler: ListarAlumnos.lambda_handler
    package:
      include:
        - ./**
    events:
      - http:
          path: /alumnos/listar
          method: get
          cors: true
          integration: lambda
          
  rotar:
    handler: RotarSecretos.lambda_handler
    events:
      - schedule: rate(10 minutes)
